server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/botica_auth_dev
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.botica.auth: DEBUG
    org.springframework.security: DEBUG

app:
  timeout: 5000