server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:prod-db}:3306/botica_auth_prod
    username: ${DB_USER:prod_user}
    password: ${DB_PASSWORD:prod_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    com.botica.auth: INFO
    org.springframework.security: WARN

app:
  timeout: 2000