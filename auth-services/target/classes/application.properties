spring.application.name=auth-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 1. Config Server con URL parametrizable y prioridad para variables locales .env
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},optional:file:.env[.properties],optional:file:../.env[.properties]

# 2. Configuración de Base de Datos con fallbacks locales
server.port=8081
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/botica_auth_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# 3. Flyway (usando variable de entorno para el hash con fallback local)
spring.flyway.enabled=true
spring.flyway.placeholders.ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:$2a$10$e8w/11S5TjF0JkP.F16bzeY30N0q8mH5y8G15NlH0H9H0H9H0H9H0}

# 4. JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# 5. JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=5