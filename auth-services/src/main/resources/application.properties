spring.application.name=auth-service

# Carga de variables locales desde .env Y conexión al Config Server
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:configserver:http://localhost:8888

# Base de datos con fallbacks a MySQL local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/botica_auth_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.placeholders.adminPasswordHash=${ADMIN_PASSWORD_HASH}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8081

# JWT: El secreto es obligatorio (se busca en la variable de entorno JWT_SECRET)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60