spring.application.name=order-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Importa Config Server usando variable de entorno (con fallback local) y archivos .env
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888},optional:file:.env[.properties],optional:file:../.env[.properties]

# Desactiva verificaciones estrictas para desarrollo local
spring.cloud.config.import-check.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# Configuración del servidor local (fallback si el config-server no lo provee)
server.port=8082

# Conexión a Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/botica_order_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Secreto JWT (Obligatorio desde .env o entorno local)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=5

# Configuración de comunicación interna (Fallback para Feign / Notificaciones)
botica.notifications.type=log
botica.auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}