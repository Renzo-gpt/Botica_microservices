spring.application.name=order-service

# Importa Config Server y opcionalmente archivos .env
spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[.properties],optional:file:../.env[.properties]

# Desactiva la verificación estricta si el Config Server no responde en el primer milisegundo
spring.cloud.config.import-check.enabled=false

# Configuración del servidor local
server.port=8082

# Conexión a Base de Datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/botica_order_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate (usamos update temporalmente para crear la tabla orders si no existe)
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Secreto JWT
app.jwt.secret=${JWT_SECRET:claveSecretaDePruebaParaDesarrolloLocal1234567890123456}
app.jwt.expiration-minutes=60