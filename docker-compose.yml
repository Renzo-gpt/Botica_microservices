version: '3.8'

services:
  auth-db:
    image: mysql:8.0
    container_name: botica-auth-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: botica_auth_db
    ports:
      - "3306:3306"
    volumes:
      - auth_db_data:/var/lib/mysql

  order-db:
    image: mysql:8.0
    container_name: botica-order-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: botica_order_db
    ports:
      - "3307:3306"
    volumes:
      - order_db_data:/var/lib/mysql

volumes:
  auth_db_data:
  order_db_data: